name: publish

on:
  push:
    tags:
      - "pi-*/v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  npm:
    name: Publish one Pi package to npm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Test release selection
        run: bun test ./.github/scripts/publish-package.test.ts

      - name: Publish the tagged package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NPM_PUBLISH_FLAGS: --provenance
        run: bash .github/scripts/publish-package.sh
